server:
  port: ${AUTH_PORT:8081}
  servlet:
    context-path: /auth

spring:
  application:
    name: auth

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:laserworks}
    username: ${POSTGRES_USER:laserworks}
    password: ${POSTGRES_PASSWORD:laserworks}

  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

---
spring:
  config:
    activate:
      on-profile: dev
springdoc:
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: server
springdoc:
  swagger-ui:
    enabled: false
