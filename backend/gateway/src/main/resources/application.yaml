server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway

  security:
    oauth2:
      client:
        registration:
          gateway:
            client-id: ${AUTH_GATEWAY_CLIENT_ID:gateway}
            client-secret: ${GATEWAY_CLIENT_SECRET:secret}
            scope:
              - openid
              - profile
        provider:
          gateway:
            issuer-uri: http://${AUTH_HOST:localhost}:${AUTH_PORT:8081}

  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: resource-service
            uri: http://${RESOURCE_HOST:localhost}:${RESOURCE_PORT:8082}
            predicates:
              - Path=/resource/**
            filters:
              - TokenRelay=
